            }
            
            const headers = ['التاريخ', 'الاسم', 'الرقم/الإيميل', 'النوع', 'المبلغ', 'الحالة', 'تاريخ التنفيذ', 'المرجع'];
            const rows = [...requests.value]
                .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))
                .map(r => [
                    formatDate(r.createdAt) || '',
                    r.teacherName || '',
                    r.teacherNumber || '',
                    r.accountType === 'Insta' ? 'إنستا باي' : 'محفظة',
                    r.value || 0,
                    r.status === 'resolved' ? 'مكتمل' : 'قيد المراجعة',
                    r.resolvedAt ? formatDate(r.resolvedAt) : '',
                    r.ocrData?.reference || ''
                ]);
            
            // Build CSV with UTF-8 BOM for Excel Arabic support
            const csv = '\uFEFF' + [headers, ...rows]
                .map(row => row.map(cell => {
                    const s = String(cell).replace(/"/g, '""');
                    return /[",\n]/.test(s) ? `"${s}"` : s;
                }).join(','))
                .join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `payments_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('تم تصدير الملف بنجاح', 'success');
        };

        // ===== Manual resolve (skip OCR) =====
        const manualResolve = async () => {
            if (!selectedFile.value) return;
            
            if (!confirm(
                `⚠️ تأكيد يدوي بدون فحص OCR\n\n` +
                `سيتم خصم ${activeReqToResolve.value.value} ج من الرصيد\n` +
                `للمعلم: ${activeReqToResolve.value.teacherName}\n\n` +
                `هل أنت متأكد؟`
            )) return;
            
            isProcessingOCR.value = true;
            try {
                const newBal = balance.value - parseFloat(activeReqToResolve.value.value);
                await fetch(authUrl(`/balance.json`), { method: 'PUT', body: JSON.stringify(newBal) });
                
                const manualData = {
                    reference: 'MANUAL',
                    amount: activeReqToResolve.value.value,
                    phone: activeReqToResolve.value.teacherNumber,
                    date: new Date().toLocaleString('ar-EG'),
                    requestedAmount: activeReqToResolve.value.value,
                    requestedPhone: activeReqToResolve.value.teacherNumber,
                    amountMatches: true,
                    phoneMatches: true,
                    hasError: false,
                    manuallyConfirmed: true
                };
                
                await fetch(authUrl(`/requests/${activeReqToResolve.value.id}.json`), { 
                    method: 'PATCH', 
                    body: JSON.stringify({ 
                        status: 'resolved', 
                        ocrData: manualData,
                        resolvedAt: new Date().toISOString()
                    }) 
                });
                
                await addLog('تم الدفع (يدوي)', `دفع ${activeReqToResolve.value.value} ج للمعلم ${activeReqToResolve.value.teacherName} بدون OCR`);
                showToast('تم تأكيد العملية يدوياً', 'success');
                closeResolveModal();
                await loadData();
            } catch (e) {
                showToast('خطأ في التأكيد: ' + e.message, 'error');
            } finally {
                isProcessingOCR.value = false;
            }
        };

        const formatDate = (ts) => {
            if (!ts) return '-';
            try {
                return new Date(ts).toLocaleString('ar-EG', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (e) {
                return ts;
            }
        };

        // Reset display limit when filter changes
        watch(filterStatus, () => {
            displayLimit.value = 20;
        });
        watch(searchQuery, () => {
            displayLimit.value = 20;
        });

        // ===== Handle GET request balance operations (Admin only) =====
        // Usage examples:
        //   ?Admin&deposit=500              → Add 500 to balance
        //   ?Admin&deposit=500&txn=ABC123   → Add 500 (with unique txn ID to prevent duplicates)
        //   ?Admin&setBalance=2000          → Set balance to exactly 2000
        //   ?Admin&deposit=500&silent=1     → Skip confirmation dialog
        const handleUrlBalanceOperations = async () => {
            const params = new URLSearchParams(window.location.search);
            
            // Only process if Admin mode
            if (params.get('Admin') === null) return;
            
            const depositParam = params.get('deposit');
            const setBalanceParam = params.get('setBalance');
            const txnId = params.get('txn'); // Optional unique transaction ID
            const silent = params.get('silent') === '1';
            
            if (!depositParam && !setBalanceParam) return;
            
            // Wait for initial data load to complete
            await loadData();
            
            // Deduplication: check if this txn was already processed
            if (txnId) {
                const txnKey = `processed_txn_${txnId}`;
                const alreadyProcessed = sessionStorage.getItem(txnKey);
                if (alreadyProcessed) {
                    console.log(`Transaction ${txnId} already processed, skipping`);
                    cleanUrl();
                    return;
                }
                
                // Also check logs to prevent re-processing on different sessions
                const txnLogged = logs.value.some(log => 
                    log.details && log.details.includes(`[TXN:${txnId}]`)
                );
                if (txnLogged) {
                    console.log(`Transaction ${txnId} found in logs, skipping`);
                    sessionStorage.setItem(txnKey, '1');
                    cleanUrl();
                    return;
                }
            }
            
            try {
                // Handle deposit (add to balance)
                if (depositParam) {
                    const amount = parseFloat(depositParam);
                    if (isNaN(amount) || amount <= 0) {
                        if (!silent) alert(`❌ مبلغ الإيداع غير صحيح: ${depositParam}`);
                        cleanUrl();
                        return;
                    }
                    
                    const confirmed = silent || confirm(
                        `🔔 طلب إيداع تلقائي عبر الرابط\n\n` +
                        `المبلغ: ${amount} جنيه\n` +
                        `${txnId ? `معرف العملية: ${txnId}\n` : ''}` +
                        `الرصيد الحالي: ${balance.value.toFixed(2)} ج\n` +
                        `الرصيد بعد الإيداع: ${(balance.value + amount).toFixed(2)} ج\n\n` +
                        `هل تريد المتابعة؟`
                    );
                    
                    if (!confirmed) {
                        cleanUrl();
                        return;
                    }
                    
                    const newBalance = balance.value + amount;
                    await fetch(authUrl(`/balance.json`), { 
                        method: 'PUT', 
                        body: JSON.stringify(newBalance) 
                    });
                    
                    const logDetails = txnId 
                        ? `إيداع تلقائي عبر الرابط: ${amount} ج [TXN:${txnId}]`
                        : `إيداع تلقائي عبر الرابط: ${amount} ج`;
                    
                    await addLog('إيداع تلقائي (GET)', logDetails);
                    
                    if (txnId) sessionStorage.setItem(`processed_txn_${txnId}`, '1');
                    
                    if (!silent) {
                        alert(`✅ تم الإيداع بنجاح\n\nالمبلغ المضاف: ${amount} ج\nالرصيد الجديد: ${newBalance.toFixed(2)} ج`);
                    }
                }
                
                // Handle setBalance (overwrite balance)
                if (setBalanceParam) {
                    const amount = parseFloat(setBalanceParam);
                    if (isNaN(amount) || amount < 0) {
                        if (!silent) alert(`❌ قيمة الرصيد غير صحيحة: ${setBalanceParam}`);
                        cleanUrl();
                        return;
                    }
                    
                    const confirmed = silent || confirm(
                        `⚠️ طلب تعديل الرصيد عبر الرابط\n\n` +
                        `الرصيد الحالي: ${balance.value.toFixed(2)} ج\n` +
                        `الرصيد الجديد: ${amount.toFixed(2)} ج\n` +
                        `${txnId ? `معرف العملية: ${txnId}\n` : ''}` +
                        `\nهل أنت متأكد من تغيير الرصيد؟`
                    );
                    
                    if (!confirmed) {
                        cleanUrl();
                        return;
                    }
                    
                    await fetch(authUrl(`/balance.json`), { 
                        method: 'PUT', 
                        body: JSON.stringify(amount) 
                    });
                    
                    const logDetails = txnId 
                        ? `تعديل الرصيد عبر الرابط إلى ${amount} ج [TXN:${txnId}]`
                        : `تعديل الرصيد عبر الرابط إلى ${amount} ج`;
                    
                    await addLog('تعديل الرصيد (GET)', logDetails);
                    
                    if (txnId) sessionStorage.setItem(`processed_txn_${txnId}`, '1');
                    
                    if (!silent) {
                        alert(`✅ تم تعديل الرصيد\n\nالرصيد الجديد: ${amount.toFixed(2)} ج`);
                    }
                }
                
                cleanUrl();
                await loadData();
            } catch (e) {
                console.error('GET balance operation error:', e);
                if (!silent) alert(`❌ خطأ في معالجة العملية: ${e.message}`);
            }
        };
        
        // Clean URL parameters after processing (keeps Admin flag)
        const cleanUrl = () => {
            const url = new URL(window.location.href);
            const isAdmin = url.searchParams.get('Admin') !== null;
            
            // Remove balance operation params
            url.searchParams.delete('deposit');
            url.searchParams.delete('setBalance');
            url.searchParams.delete('txn');
            url.searchParams.delete('silent');
            
            // Keep Admin flag if present
            const newSearch = isAdmin ? '?Admin' : '';
            const newUrl = url.pathname + newSearch + url.hash;
            window.history.replaceState({}, '', newUrl);
        };

        onMounted(async () => {
            // Load dark mode preference (works on auth screen too)
            try {
                darkMode.value = localStorage.getItem('darkMode') === '1';
                applyDarkMode();
            } catch(e) {}
            
            // Render initial icons (for auth screen)
            nextTick(() => { if (window.lucide) lucide.createIcons(); });
            
            // Note: data loading and URL balance ops are now triggered by
            // auth.onAuthStateChanged when the user successfully signs in.
            
            // Auto-refresh data while authenticated
            setInterval(() => {
                if (isAuthenticated.value) loadData();
            }, 20000);
        });

        return {
            role, balance, requests, logs, favorites, displayLimit, filterStatus,
            showLogsModal, showResolveModal, showDepositModal, showEditBalanceModal, showRequestModal, showAllFavorites,
            showStatsModal, darkMode, searchQuery, skipOCR, showRawText, toasts,
            // Auth state
            isAuthenticated, authLoading, currentUser, authEmail, authPassword, 
            showPassword, rememberMe, authError, authProcessing,
            // Auth methods
            handleAuthSubmit, handleForgotPassword, handleLogout,
            selectedFile, selectedFileName, imagePreview, isProcessingOCR, ocrProgress, ocrStatus, ocrResultPreview,
            depositAmount, newBalanceVal, currentRequest, editingRequestId, originalEditValue,
            pendingTotal, availableBalance, pendingCount, resolvedCount, canSubmitRequest,
            hasMoreToShow, remainingCount, stats,
            handleDeposit, openEditBalance, handleUpdateBalance, toggleLogs, shareBalance,
            openRequestModal, closeRequestModal, handleCreateRequest, handleDeleteRequest,
            openResolveModal, closeResolveModal, handleImageSelection, processOCRAndResolve, manualResolve,
            isFavorite, toggleFavorite, removeFavorite, createFromFavorite, openPaymentApp,
            sortedLogs, filteredRequests,
            toggleDarkMode, copyToClipboard, exportToCSV, dismissToast, showToast, openStatsModal,
            formatDate
        }
    }
}).mount('#app');
</script>
</body>
</html>
